<!DOCTYPE html>
<html>
<head>
    <title>Simple Search</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px; }
        .result { margin-top: 10px; }
    </style>
</head>
<body>

<script>
async function search() {
    const query = document.getElementById("searchInput").value.trim();

    // If input is empty, show message and exit
    if (!query) {
        document.getElementById("results").innerHTML = "<p>Please enter a name.</p>";
        return;
    }

    let newstring = '';

    try {
        const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        if (data.length === 0) {
            resultsDiv.innerHTML = "<p>No results found.</p>";
            return;
        }

        // ✅ Only use the first (and only) candidate
        const candidate = data[0];

        const div = document.createElement("div");
        div.className = "result";

        div.innerHTML = `
            <h3>${candidate.name}</h3>
            <p><strong>Party:</strong> ${candidate.party}</p>
            <p><strong>State:</strong> ${candidate.state}</p>
            <p><strong>County:</strong> ${candidate.county}</p>
            <p><strong>District:</strong> ${candidate.electoral_district}</p>
            <p><strong>Bio:</strong> ${candidate.bio}</p>
        `;

        resultsDiv.appendChild(div);

        // Load tweets for this candidate
        loadTweets(candidate.name);

    } catch (err) {
        console.error(err);
        document.getElementById("results").innerHTML = "<p>Error fetching results.</p>";
    }
    
    loadTweets(newstring); // Load tweets after search
}
</script>

<div style="display: flex; gap: 20px;">

    <!-- LEFT: Search + Results -->
    <div style="flex: 2;">
        <h2>Search Candidates</h2>
        <input type="text" id="searchInput">
        <button onclick="search()">Search</button>

        <div id="results"></div>
    </div>

    <!-- RIGHT: Tweet Feed -->
    <div style="flex: 1; border-left: 1px solid #ccc; padding-left: 10px;">
        <h3>Tweet Feed</h3>
        <div id="tweets"></div>
    </div>

</div>
<script>
async function loadTweets(candidateName) {
    try {
        const res = await fetch(`/tweets?candidate=${encodeURIComponent(candidateName)}`);        const data = await res.json();

        const tweetsDiv = document.getElementById("tweets");
        tweetsDiv.innerHTML = "";

        data.forEach(tweet => {
            const div = document.createElement("div");
            div.className = "tweet";

            div.innerHTML = `
                ${tweet.text}
                <hr>
            `;

            tweetsDiv.appendChild(div);
        });

    } catch (err) {
        console.error(err);
    }
}
</script>

</body>
</html>
